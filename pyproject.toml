[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusai"
version = "0.1.0"
description = "NexusAI: AI-Powered Personal Task Automation — hybrid workflow engine for decompose/execute/verify/adapt"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "NexusAI (MSc Data Science project)" }]
keywords = ["workflow-automation", "llm-agents", "rag", "research-project"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies. Deliberately minimal for Day 1:
# web shell, settings, persistence, UI, and the HTTP client used by tests.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "streamlit>=1.38,<2.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "networkx>=3.0,<4.0",
    "pymupdf>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    # Timezone support for reminders. `tzlocal` resolves the machine's
    # local zone to an IANA name on every platform; `tzdata` is what
    # `zoneinfo` reads on Windows, which ships no timezone database.
    "tzlocal>=5.0,<7.0",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
nexusai = "nexusai.app.cli:main"

[project.urls]
Documentation = "https://example.invalid/nexusai/docs"

[tool.setuptools.packages.find]
include = ["nexusai*"]

[tool.setuptools.package-data]
nexusai = ["py.typed"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    "error::DeprecationWarning:nexusai.*",
]
markers = [
    "e2e: end-to-end tests that exercise the full application stack",
    "integration: tests that exercise multiple components together",
    "unit: isolated unit tests",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["nexusai", "tests", "scripts"]
extend-exclude = [".venv", "data", "artifacts", "experiments/runs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length handled by the formatter
    "B008",   # FastAPI Depends() in defaults is the documented idiom
    "RUF001", # ambiguous unicode — prose in docstrings is fine
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "N806"]
"scripts/**" = ["T201"]
# The Streamlit entry point must bootstrap sys.path before importing the package.
"nexusai/app/ui/app.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["nexusai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["nexusai"]
branch = true
omit = [
    "nexusai/app/ui/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
